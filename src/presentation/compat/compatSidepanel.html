<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temu 商品工作台</title>
    <link rel="stylesheet" href="/src/shared/theme.css">
    <link rel="stylesheet" href="./compatSidepanel.css">
  </head>
  <body>
    <main class="compat-shell">
      <header class="nav-shell" role="tablist" aria-label="商品工作台功能">
        <div class="nav-group">
          <span class="nav-group-label">主线</span>
          <div class="segment-control" data-group="main">
            <button id="tabT2" class="segment-tab" type="button" role="tab" aria-selected="false" data-panel="panelT2">T2交集</button>
            <button id="tab1688" class="segment-tab is-active" type="button" role="tab" aria-selected="true" data-panel="panel1688">1688核价</button>
          </div>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">工具</span>
          <div class="segment-control" data-group="tools">
            <button id="tabGpt" class="segment-tab" type="button" role="tab" aria-selected="false" data-panel="panelGpt">GPT</button>
            <button id="tabDxmPrice" class="segment-tab" type="button" role="tab" aria-selected="false" data-panel="panelDxmPrice">后台辅助工具</button>
            <button id="tabSplit" class="segment-tab" type="button" role="tab" aria-selected="false" data-panel="panelSplit">分屏</button>
          </div>
        </div>
      </header>

      <section id="panelT2" class="panel" role="tabpanel" aria-labelledby="tabT2">
        <iframe title="T2 价格表信息表交集处理" src="/src/presentation/t2/t2Intersection.html"></iframe>
      </section>

      <section id="panel1688" class="panel is-active" role="tabpanel" aria-labelledby="tab1688">
        <iframe title="1688 商品录入工具" src="/src/legacy/1688/popup.html"></iframe>
      </section>

      <section id="panelGpt" class="panel" role="tabpanel" aria-labelledby="tabGpt">
        <iframe title="GPT 主图" src="/src/legacy/gptDebug/sidepanel.html"></iframe>
      </section>

      <section id="panelDxmPrice" class="panel combined-panel" role="tabpanel" aria-labelledby="tabDxmPrice">
        <div class="subnav-shell" role="tablist" aria-label="后台辅助工具">
          <button class="subnav-tab is-active" type="button" data-tool="dxm">店小秘</button>
          <button class="subnav-tab" type="button" data-tool="price">零售价</button>
          <button class="subnav-tab" type="button" data-tool="backend">合规助手</button>
        </div>
        <div class="tool-frame is-active" data-tool-frame="dxm">
          <iframe title="店小秘" src="/src/presentation/dxm/dxmTool.html"></iframe>
        </div>
        <div class="tool-frame" data-tool-frame="price">
          <iframe title="建议零售价填写" src="/src/presentation/priceFiller/priceFiller.html"></iframe>
        </div>
        <div class="tool-frame" data-tool-frame="backend">
          <iframe title="后台辅助工具" src="/src/presentation/backendHelper/backendHelper.html"></iframe>
        </div>
      </section>

      <section id="panelSplit" class="panel" role="tabpanel" aria-labelledby="tabSplit">
        <iframe title="Temu 分屏采集" src="/src/presentation/temuSplit/temuSplitPanel.html"></iframe>
      </section>
    </main>

    <script src="./compatSidepanel.js"></script>
  </body>
</html>
